<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users Directory</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      margin: 0;
      padding: 30px 16px;
    }

    main {
      max-width: 900px;
      margin: auto;
    }

    #users-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 16px;
    }

    .user-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px #00000010;
      overflow-wrap: anywhere;
    }

    .user-card h2 {
      color: #2563eb;
      font-size: 20px;
    }

    .message {
      padding: 16px;
      border-radius: 8px;
      background: white;
    }

    .error {
      color: #b91c1c;
    }
  </style>
  <script type="module" src="./main.js"></script>
</head>
<body>
  <main>
    <h1>Users Directory</h1>
    <p>Users loaded from JSONPlaceholder API.</p>

    <p id="status" class="message" role="status" aria-live="polite">
      Loading users...
    </p>

    <section id="users-list" aria-label="Users"></section>
  </main>
</body>
</html>
